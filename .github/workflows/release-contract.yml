name: Release contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check pinned components and mixed-agent startup
        run: python scripts/check-release.py --components-dir "$RUNNER_TEMP/components" --fetch
